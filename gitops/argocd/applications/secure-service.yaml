apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lawrencechew/secure-aks-service-blueprint.git
    targetRevision: master
    path: helm/secure-service
    helm:
      releaseName: secure-service
      values: |
        workloadIdentity:
          enabled: true
          serviceAccountName: secure-service
        monitoring:
          enabled: true
          serviceMonitor:
            enabled: true
          prometheusRule:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

