apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-service-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lawrencechew/secure-aks-service-blueprint.git
    targetRevision: master
    path: helm/secure-service
    helm:
      releaseName: secure-service
      valueFiles:
        - ../../gitops/values/prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-service-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

