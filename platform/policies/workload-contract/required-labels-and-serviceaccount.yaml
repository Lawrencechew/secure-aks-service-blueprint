apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: workload-contract-labels-and-serviceaccount
  annotations:
    policies.kyverno.io/title: Require workload ownership labels and service account
    policies.kyverno.io/category: workload-contract
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: ownership-labels-required
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: Workload labels platform.secure-aks.io/{service,owner,environment} are required.
        pattern:
          metadata:
            labels:
              platform.secure-aks.io/service: "?*"
              platform.secure-aks.io/owner: "?*"
              platform.secure-aks.io/environment: "?*"

    - name: serviceaccount-required
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: serviceAccountName is required to align with workload identity expectations.
        pattern:
          spec:
            serviceAccountName: "?*"

