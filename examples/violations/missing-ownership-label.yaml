apiVersion: apps/v1
kind: Deployment
metadata:
  name: violation-missing-ownership-label
  namespace: default
spec:
  selector:
    matchLabels:
      app: violation-missing-ownership-label
  template:
    metadata:
      labels:
        app: violation-missing-ownership-label
        platform.secure-aks.io/service: secure-service
        platform.secure-aks.io/environment: dev
    spec:
      serviceAccountName: secure-service
      containers:
        - name: app
          image: example.azurecr.io/secure-service:v1.2.3
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080

