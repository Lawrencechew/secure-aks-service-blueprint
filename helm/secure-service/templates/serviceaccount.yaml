apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "secure-service.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "secure-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: "{{ .Values.workloadIdentity.clientID | default "" }}"
{{- end }}
