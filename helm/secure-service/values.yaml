replicaCount: 2
image:
  repository: "<your-registry>/secure-aks-service"
  tag: "v1.2.3"
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

keyVault:
  enabled: false
  secretProviderClass: ""

workloadIdentity:
  enabled: false
  serviceAccountName: ""
  clientID: ""

labels: {}

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true
  slo:
    availabilityObjectivePercent: 99.9
    latencyObjectivePercent: 95
    latencyThresholdSeconds: "0.5"
    errorBudgetRatio: "0.001"
    excludedEndpointsRegex: "^/(health|ready|metrics)$"
  alerts:
    fastBurn:
      threshold: "14.4"
      for: 2m
    slowBurn:
      threshold: "3"
      for: 15m
