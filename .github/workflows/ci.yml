name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Ruff check
        run: ruff check .
      - name: Run tests
        run: pytest -q
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Set up Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.2
      - name: Build image
        run: |
          docker build -t secure-aks-service:ci .
      - name: Trivy filesystem scan (blocking)
        run: |
          trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore .
      - name: Trivy image scan (blocking)
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore secure-aks-service:ci
      - name: Generate SBOM
        run: trivy image --format cyclonedx -o sbom.xml secure-aks-service:ci
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml
  infra-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Set up Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.2
      - name: Terraform fmt (blocking)
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Terraform init without backend (blocking)
        run: terraform -chdir=infra/terraform/environments/${{ matrix.environment }} init -backend=false
      - name: Terraform validate (blocking)
        run: terraform -chdir=infra/terraform/environments/${{ matrix.environment }} validate
      - name: TFLint init plugins
        run: tflint --chdir=infra/terraform/environments/${{ matrix.environment }} --init --config=../../.tflint.hcl
      - name: TFLint (blocking)
        run: tflint --chdir=infra/terraform/environments/${{ matrix.environment }} --config=../../.tflint.hcl
      - name: Trivy config scan (blocking)
        run: trivy config --exit-code 1 --severity CRITICAL,HIGH infra/terraform
      - name: Helm lint
        run: helm lint helm/secure-service
  negative-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.2
      - name: Verify Trivy gate fails on known-bad fixture
        run: |
          if trivy config --exit-code 1 --severity HIGH,CRITICAL platform/negative-tests/trivy; then
            echo "Expected Trivy to fail for the insecure fixture, but it passed."
            exit 1
          fi
  policy-guardrails:
    runs-on: ubuntu-latest
    needs: negative-gates
    steps:
      - uses: actions/checkout@v4
      - name: Run Kyverno policy tests (blocking)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work ghcr.io/kyverno/kyverno-cli:v1.12.6 test platform/policies/tests
  sre-validation:
    runs-on: ubuntu-latest
    needs: policy-guardrails
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus rule syntax check (blocking)
        run: |
          docker run --rm --entrypoint promtool -v "${{ github.workspace }}:/work" -w /work prom/prometheus:v2.55.0 check rules platform/sre/prometheus/slo-rules.yaml
      - name: Prometheus alert behavior tests (blocking)
        run: |
          docker run --rm --entrypoint promtool -v "${{ github.workspace }}:/work" -w /work prom/prometheus:v2.55.0 test rules platform/sre/prometheus/slo-alert-tests.yaml
      - name: Validate GitOps manifests (blocking)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7 -strict -ignore-missing-schemas gitops/argocd/applications/*.yaml
      - name: Ensure Helm renders monitoring resources
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work alpine/helm:3.16.3 template secure-service helm/secure-service > rendered.yaml
          grep -q "kind: ServiceMonitor" rendered.yaml
          grep -q "kind: PrometheusRule" rendered.yaml
