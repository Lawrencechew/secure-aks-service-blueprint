name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Ruff check
        run: ruff check .
      - name: Run tests
        run: pytest -q
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build image
        run: |
          docker build -t secure-aks-service:ci .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v1
        with:
          scan-type: fs
          vuln-type: "os,library"
          format: 'table'
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v1
        with:
          scan-type: image
          image-ref: secure-aks-service:ci
      - name: Generate SBOM
        run: trivy image --format cyclonedx -o sbom.xml secure-aks-service:ci || true
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml
  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform fmt
        run: |
          cd infra/terraform
          terraform fmt -check || true
      - name: Helm lint
        run: |
          helm lint helm/secure-service || true
